<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f10">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src https://wsgpvqwapdpmpqsdjbks.supabase.co wss://wsgpvqwapdpmpqsdjbks.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Mr Black — المنيو</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body>
  <header class="m-header">
    <div class="m-header-in">
      <div>
        <div class="brand" id="cafe-name">Mr Black</div>
        <div class="muted m-table" id="table-label"></div>
      </div>
      <button class="btn btn-sm btn-ghost hidden" id="my-orders-btn" type="button">فواتيري</button>
    </div>
    <nav class="chips" id="chips" aria-label="أقسام المنيو"></nav>
  </header>

  <main class="m-main" id="app" aria-live="polite">
    <div class="state"><div class="spinner"></div>جارٍ تحميل المنيو…</div>
  </main>

  <div class="cart-bar hidden" id="cart-bar">
    <button class="btn btn-gold cart-btn" id="cart-btn" type="button">
      <span>عرض السلة (<span id="cart-count" class="num">0</span>)</span>
      <span id="cart-total" class="num"></span>
    </button>
  </div>

  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/menu.js"></script>
</body>
</html>
